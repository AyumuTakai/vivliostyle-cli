<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Embedded SVG</title>
  </head>
  <body>
    <p>The first page</p>
    <p style="break-before: page">An object element on the second page</p>
    <object data="image.svg" type="image/svg+xml"></object>
    <p style="break-before: page">An embed element on the third page</p>
    <embed src="image.svg" type="image/svg+xml" />
  </body>
</html>
